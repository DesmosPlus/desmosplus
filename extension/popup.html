<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DesmosPlus Transfer</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <img src="icons/icon-48.png" width="40" height="40" alt="">
        <h1>DesmosPlus</h1>
      </header>
      <div class="field">
        <label for="graph-name">Name</label>
        <input id="graph-name" value="Untitled" autocomplete="off">
      </div>
      <div class="field">
        <label for="graph-category">Category</label>
        <input id="graph-category" value="Imported" autocomplete="off">
      </div>
      <div class="actions">
        <button id="export" type="button">Export</button>
        <button id="import" type="button">Import</button>
      </div>
      <input id="import-file" type="file" accept=".desmos,.desmosplus.json,.json,application/json" hidden>
      <p id="status" aria-live="polite">Open a Desmos calculator.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
