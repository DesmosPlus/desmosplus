<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DesmosPlus Exporter</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>DesmosPlus</h1>
      <label for="graph-name">Name</label>
      <input id="graph-name" value="Untitled" autocomplete="off">
      <label for="graph-category">Category</label>
      <input id="graph-category" value="Imported" autocomplete="off">
      <button id="export" type="button">Export graph</button>
      <p id="status" aria-live="polite">Open a Desmos calculator.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
